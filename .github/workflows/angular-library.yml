name: Angular library

# Called by every ng-packagr package in the set. All eight have byte-identical
# `scripts`, so the steps belong in one place: with only two copies in existence
# they had already drifted to 53 and 71 lines, differing in the Node matrix, the
# install command, and whether lint ran at all.
#
# A caller supplies only what genuinely differs.

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node majors, e.g. ["22","24"]'
        type: string
        default: '["22","24"]'
      bundle:
        description: >-
          Path to the fesm2022 bundle, when the package ships one, so the
          framework-external assertion can run. Empty skips that step.
        type: string
        default: ''
      resolve:
        description: >-
          `lockfile` installs the committed package-lock.json with npm ci;
          `latest` resolves the newest versions the ranges allow. Empty (the
          default) picks by event: a schedule or a manual dispatch is
          `latest`, a push or a pull request is `lockfile`.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # The committed lockfile's advisories against the package's list (npm-advisories.yml). On every push, pull request
  # and the weekly schedule, so an advisory published in a quiet week is still found.
  advisories:
    uses: coolms/.github/.github/workflows/npm-advisories.yml@develop

  build:
    # !! The job's name is what branch protection requires (`ci / Node 22`,
    # `ci / Node 24`): it must not change. On 2026-09-26 it carried the resolve
    # mode ("Node 22 (lockfile)"), the required checks never arrived, and every
    # pull request in core-angular was BLOCKED. The mode is on the install step.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    env:
      RESOLVE: ${{ inputs.resolve != '' && inputs.resolve || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'latest' || 'lockfile') }}

    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This step is what decides whether the package is really standalone: it
      # installs into an EMPTY tree, with no sibling packages and none of the
      # shared node_modules the working copy reaches through a symlink.
      #
      # Two ways to resolve that tree (decided 2026-09-26). Until then there was
      # no lockfile and every run resolved the newest versions -- so on
      # 2026-09-25 ng-packagr 22.2.1 changed its quote style and turned every
      # package's pull request red for a reason outside any of them.
      #  - `lockfile` (a push, a pull request): `npm ci` from the COMMITTED
      #    lockfile. A pull request is built with the toolchain it was given, and
      #    no lockfile is an error, not a fallback to "whatever resolves today".
      #  - `latest` (the weekly schedule, or run by hand): the newest versions the
      #    declared ranges allow. This is where the next upstream change shows up
      #    first, in a run that blocks nobody; the next step names every version
      #    it differs from the lockfile in.
      - name: Install dependencies (${{ env.RESOLVE }})
        run: |
          case "$RESOLVE" in
            lockfile)
              if [ ! -f package-lock.json ]; then
                echo "::error::no package-lock.json -- a push or a pull request installs the committed lockfile (npm ci). Commit one: npm install --package-lock-only"
                exit 1
              fi
              npm ci ;;
            latest)
              if [ -f package-lock.json ]; then cp package-lock.json "$RUNNER_TEMP/committed-lock.json"; fi
              rm -f package-lock.json
              npm install --no-audit --no-fund ;;
            *)
              echo "::error::resolve must be lockfile or latest, got '$RESOLVE'"
              exit 1 ;;
          esac

      # The report of a `latest` run: which packages resolve to a version the
      # committed lockfile does not hold. In the run's summary, with the count
      # first, so "0 of N" is a statement and not an empty section.
      - name: The newest versions, against the lockfile
        if: env.RESOLVE == 'latest'
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")).packages || {}; } catch { return null; } };
            const was = read(process.env.RUNNER_TEMP + "/committed-lock.json");
            const now = read("package-lock.json") || {};
            const name = (k) => k.replace(/^node_modules\//, "");
            const lines = ["### Newest versions against the committed lockfile"];
            if (was === null) {
              lines.push("There is no committed lockfile to compare with.");
            } else {
              const differ = [];
              for (const [k, v] of Object.entries(now)) {
                if (k === "") continue;
                if (!was[k]) differ.push("- " + name(k) + ": " + v.version + " (not in the lockfile)");
                else if (was[k].version !== v.version) differ.push("- " + name(k) + ": " + was[k].version + " -> " + v.version);
              }
              lines.push(differ.length + " of " + (Object.keys(now).length - 1) + " installed packages differ from the lockfile.");
              lines.push(...differ.slice(0, 300));
              if (differ.length > 300) lines.push("- ... and " + (differ.length - 300) + " more");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.slice(0, 2).join("\n"));
          '

      # Types first: the cheapest signal, and the one most likely to catch a
      # sibling API change, since these libraries are consumed from source by
      # the application rather than from a published build.
      - name: Typecheck
        run: npm run typecheck

      # The lint config is VENDORED into each package (eslint.config.base.mjs)
      # precisely so it can run here rather than only inside the application.
      - name: Lint
        run: npm run lint

      # ng-packagr writes dist/. Building is what proves the public API surface
      # compiles as a package, not merely that the sources typecheck -- and the
      # application consumes these from source, so nothing else ever runs it.
      - name: Build the package
        run: npm run build

      # A build that silently produced nothing would pass every step above.
      - name: Assert the build produced a package
        run: |
          test -f dist/package.json || {
            echo "::error::no dist/package.json -- the build produced nothing"
            exit 1
          }
          echo "built: $(find dist -type f | wc -l) files"

      # Both assertions are POSITIVE -- they name what must be present, so the
      # step cannot pass by finding nothing.
      #
      # If Angular ended up INSIDE the bundle the package would stop being a
      # library: two copies of the framework in one application fail at runtime,
      # and the symptom is a blank screen rather than an error anyone can
      # search for. If the output were fully compiled rather than partial, it
      # would be pinned to the exact Angular it was built against.
      #
      # Either quote: ng-packagr 22.2.1 (resolved fresh, before the lockfiles)
      # writes `from "@angular/core"`, and the single-quote match failed every
      # package's build from 2026-09-25 with the framework still external.
      #
      # ANY partial declaration, not one kind: partial compilation leaves
      # ngDeclareFactory + ngDeclareClassMetadata for every decorated class and
      # ngDeclareInjectable / Component / Directive / Pipe / NgModule by kind.
      # Asserting ngDeclareInjectable held only for packages that happen to have
      # a service -- pdf-angular (one component, no service) failed it on
      # 2026-09-27 with the framework external and the output partial. Each
      # assertion now names itself when it fails; a bare `grep -q` said nothing.
      - name: Library output, framework external
        if: inputs.bundle != ''
        env:
          BUNDLE: ${{ inputs.bundle }}
        run: |
          test -f "$BUNDLE" || { echo "::error::no bundle at $BUNDLE -- the build did not write it"; exit 1; }
          grep -qE "from ['\"]@angular/core['\"]" "$BUNDLE" || { echo "::error::$BUNDLE imports nothing from @angular/core -- the framework is inside the bundle, or nothing Angular was built"; exit 1; }
          grep -qE 'ngDeclare(Factory|Injectable|Component|Directive|Pipe|NgModule|ClassMetadata)' "$BUNDLE" || { echo "::error::$BUNDLE holds no partial declaration (ngDeclare*) -- fully compiled output is pinned to the Angular it was built with"; exit 1; }
          echo "confirmed: framework external, partial-compiled output -- $(grep -oE 'ngDeclare[A-Za-z]+' "$BUNDLE" | sort | uniq -c | awk '{ printf "%s%s x%s", (NR > 1 ? ", " : ""), $2, $1 }')"
