name: npm advisories

# Advisories may only fall (2026-10-07). `npm audit` reads the COMMITTED lockfile, and every advisory it reports must
# be on the repository's list (.github/advisories.txt by default; a missing list is an empty one) at or above the
# severity it was accepted at. It fails on:
#   - an advisory not on the list: a dependency a pull request brings, or one published since the last run;
#   - a line on the list whose advisory is no longer reported, so the list only shrinks;
#   - an advisory now rated HIGHER than its line records (a lower rating is named and passes);
#   - a line past its review date (2026-10-07): at most 30 days out for critical and high, 90 for the rest. A review
#     writes a new date and the reason as it stands then; a date further out than that is a malformed line;
#   - a package.json with no package-lock.json beside it, so removing the lockfile is no way round the check;
#   - any npm error, and no report at all.
# A check that could not evaluate does not pass either, because a green check reads as clear: when the registry is
# out of reach (a network error or a 5xx) the audit is retried with backoff, then fails as
# "UNEVALUABLE: registry unreachable". A rerun clears it.
#
# The list, one advisory per line, `#` starts a comment:
#
#   <package> <advisory id> <severity accepted at> <review by YYYY-MM-DD> <why it stays>

on:
  workflow_call:
    inputs:
      working-directory:
        description: The directory holding package.json and package-lock.json.
        type: string
        default: '.'
      list:
        description: The list of known advisories, from the repository root.
        type: string
        default: '.github/advisories.txt'

permissions:
  contents: read

jobs:
  audit:
    name: Advisories against the list
    runs-on: ubuntu-latest
    # Three attempts at npm's default fetch timeout (300 s, retried twice) could hold a registry that drops packets for
    # most of an hour, and the job default is six. 20 minutes ends it as a failure, which a rerun clears.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The lockfile only: no install, so nothing a package runs at install time can change the answer. The script runs
      # `npm audit --json --package-lock-only` itself, so the retries are part of what is tested.
      - name: Advisories against the list
        env:
          LIST: ${{ github.workspace }}/${{ inputs.list }}
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const summary = [];
            const out = (line) => { console.log(line); summary.push(line); };
            const finish = (code) => {
              if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Advisories against the list\n" + summary.join("\n") + "\n");
              process.exit(code);
            };
            const sleep = (ms) => { if (ms > 0) Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms); };
            const ghsa = /GHSA(-[23456789cfghjmpqrvwx]{4}){3}/;
            const rank = { info: 0, low: 1, moderate: 2, medium: 2, high: 3, critical: 4 };
            // Every line is reviewed by a date (2026-10-07): at most 30 days out for critical and high, 90 for the rest. A line past
            // its date fails until it is reviewed again -- a new reason and a new date -- or its advisory is cleared.
            const horizon = (severity) => (rank[severity] >= rank.high ? 30 : 90);
            const day = (iso) => Date.parse(iso + "T00:00:00Z") / 86400000;
            const isDate = (iso) => /^\d{4}-\d{2}-\d{2}$/.test(iso) && !Number.isNaN(day(iso)) && new Date(iso + "T00:00:00Z").toISOString().slice(0, 10) === iso;
            const today = process.env.ADVISORIES_TODAY || new Date().toISOString().slice(0, 10);

            const listPath = process.env.LIST;
            const listed = new Map();
            const accepted = new Map();
            const reviewBy = new Map();
            const malformed = [];
            if (fs.existsSync(listPath)) {
              fs.readFileSync(listPath, "utf8").split("\n").forEach((raw, i) => {
                const text = raw.split("#")[0].trim();
                if (!text) return;
                const f = text.split(/\s+/);
                const at = listPath + ":" + (i + 1) + ": ";
                if (f.length < 5) { malformed.push(at + "want <package> <advisory> <severity> <review by YYYY-MM-DD> <why it stays>"); return; }
                if (!(f[2] in rank)) { malformed.push(at + "severity " + f[2] + " is not one of " + Object.keys(rank).join(", ")); return; }
                if (!isDate(f[3])) { malformed.push(at + "review date " + f[3] + " is not a date (YYYY-MM-DD)"); return; }
                if (day(f[3]) - day(today) > horizon(f[2])) { malformed.push(at + "review date " + f[3] + " is more than " + horizon(f[2]) + " days after " + today + ", the most a " + f[2] + " line may run"); return; }
                const key = f[0] + " " + f[1];
                if (listed.has(key)) { malformed.push(listPath + ":" + (i + 1) + ": " + key + " is listed twice (first at line " + listed.get(key) + ")"); return; }
                listed.set(key, i + 1);
                accepted.set(key, f[2]);
                reviewBy.set(key, f[3]);
              });
            }

            // The audit reads the COMMITTED lockfile. A package.json with none beside it fails by name: deleting the lockfile is
            // no way round the check.
            if (fs.existsSync("package.json") && !fs.existsSync("package-lock.json")) {
              out("advisories: FOUND -- package.json has no package-lock.json beside it; the audit reads the committed lockfile");
              finish(1);
            }

            // Where npm puts the reason it could not answer (npm 11.19, measured 2026-10-07): a network failure only in the
            // top-level message ("... failed, reason: connect ECONNREFUSED ...", error.summary empty), a registry 5xx as
            // statusCode, anything else as error.code (ENOLOCK: a lockfile npm cannot parse). With --json npm writes JSON even when
            // the registry is out of reach, so no report at all is npm itself failing.
            const unreachable = /^(ENOTFOUND|EAI_AGAIN|ECONNREFUSED|ECONNRESET|ETIMEDOUT|EHOSTUNREACH|ENETUNREACH|E5\d\d)$/;
            const audit = (command) => {
              let text = "";
              try { text = execSync(command, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"], maxBuffer: 256 * 1024 * 1024 }); }
              catch (e) { text = String(e.stdout || ""); }
              if (!text.trim()) return { failed: "npm wrote nothing" };
              let report;
              try { report = JSON.parse(text); } catch (e) { return { failed: "npm wrote no report: " + String(e.message).split("\n")[0].slice(0, 160) }; }
              if (report === null || typeof report !== "object") return { failed: "npm wrote JSON that is not a report" };
              if (report.vulnerabilities) return { report };
              const err = report.error && typeof report.error === "object" ? report.error : {};
              const inMessage = /\bE[A-Z0-9_]{2,}\b/.exec(String(report.message || ""));
              const code = String(err.code || (report.statusCode ? "E" + report.statusCode : "") || (inMessage ? inMessage[0] : ""));
              const said = "npm said " + (code || "an error") + ": " + String(err.summary || report.message || "").trim().slice(0, 160);
              return unreachable.test(code) ? { unreachable: said } : { failed: said };
            };

            // A check that could not evaluate must not pass: a green check reads as clear. The registry out of reach is retried
            // with backoff, then fails as UNEVALUABLE; a rerun clears it.
            const command = process.env.AUDIT_CMD || "npm audit --json --package-lock-only";
            const backoff = (process.env.BACKOFF_MS || "10000,30000").split(",").map(Number);
            let result = audit(command);
            for (let attempt = 0; result.unreachable && attempt < backoff.length; attempt++) {
              console.error("registry unreachable (" + result.unreachable + "); attempt " + (attempt + 2) + " in " + backoff[attempt] + " ms");
              sleep(backoff[attempt]);
              result = audit(command);
            }
            if (result.unreachable) {
              out("advisories: UNEVALUABLE: registry unreachable -- " + result.unreachable + " (" + (backoff.length + 1) + " attempts); a rerun clears it");
              console.log("::error::advisories could not be evaluated: registry unreachable");
              finish(1);
            }
            if (result.failed) {
              out("advisories: FOUND -- the audit failed for a reason that is not the network: " + result.failed);
              finish(1);
            }

            const reported = new Map();
            for (const v of Object.values(result.report.vulnerabilities)) {
              for (const via of v.via || []) {
                if (typeof via !== "object") continue;
                const m = ghsa.exec(via.url || "");
                reported.set((via.name || v.name) + " " + (m ? m[0] : String(via.source)), { severity: via.severity || "unknown", title: via.title || "" });
              }
            }
            const now = (k) => reported.get(k).severity;
            const fresh = [...reported.keys()].filter((k) => !listed.has(k)).sort();
            const gone = [...listed.keys()].filter((k) => !reported.has(k)).sort();
            // Each line records the severity the advisory was accepted at: a HIGHER one now fails, a lower one is named and passes
            // (what was accepted at the higher severity covers the lower). A severity npm does not name counts as higher.
            const higher = [...listed.keys()].filter((k) => reported.has(k) && !((rank[now(k)] ?? 99) <= rank[accepted.get(k)])).sort();
            const lower = [...listed.keys()].filter((k) => reported.has(k) && rank[now(k)] < rank[accepted.get(k)]).sort();
            const expired = [...listed.keys()].filter((k) => day(reviewBy.get(k)) < day(today)).sort();
            const due = [...listed.keys()].filter((k) => !expired.includes(k) && day(reviewBy.get(k)) - day(today) <= 7).sort();

            out("advisories: " + reported.size + " reported by npm audit (the committed lockfile) against " + listed.size + " listed in " + listPath + " (review dates held to " + today + ")");
            fresh.forEach((k) => out("  NEW    " + k + " [" + now(k) + " " + reported.get(k).title + "]"));
            gone.forEach((k) => out("  GONE   " + k + " -- cleared: take line " + listed.get(k) + " off the list"));
            higher.forEach((k) => out("  HIGHER " + k + " -- accepted at " + accepted.get(k) + ", now " + now(k) + ": line " + listed.get(k)));
            lower.forEach((k) => out("  lower  " + k + " -- accepted at " + accepted.get(k) + ", now " + now(k) + " (passes; line " + listed.get(k) + " may record it)"));
            expired.forEach((k) => out("  EXPIRED " + k + " -- review by " + reviewBy.get(k) + " has passed: line " + listed.get(k) + " needs a new review (reason and date), or the advisory cleared"));
            due.forEach((k) => out("  due    " + k + " -- review by " + reviewBy.get(k) + " (line " + listed.get(k) + ")"));
            malformed.forEach((m) => out("  LIST   " + m));
            if (fresh.length || gone.length || higher.length || expired.length || malformed.length) {
              out("advisories: FOUND -- " + fresh.length + " new, " + gone.length + " cleared but still listed, " + higher.length + " re-rated higher, " + expired.length + " past their review date, " + malformed.length + " malformed line(s). A new advisory is cleared by an update, or written on the list with its severity, review date and why it stays.");
              finish(1);
            }
            out("advisories: CLEAR -- every advisory reported is listed at or above its severity, every one listed is still reported, and none is past its review date");
            finish(0);
          '
